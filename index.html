<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Procurement Prototype</title>
<style>
:root{--g:#214735;--p:#edf3ed;--l:#d8e2d9;--t:#26382d;--m:#718076}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--t);font:14px Arial}header{background:#173c31;color:white;padding:16px 22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}header b{letter-spacing:.04em}header small{color:#c8ddd3}.layout{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 55px)}aside{background:var(--p);padding:12px;border-right:1px solid var(--l)}main{padding:20px;min-width:0;max-width:1500px;width:100%;margin:auto}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:7px;margin:2px 0;cursor:pointer;color:var(--t)}.nav.active,.nav:hover{background:#dce9df;color:var(--g);font-weight:bold}.label{font-size:9px;color:var(--m);font-weight:bold;letter-spacing:.12em;padding:10px}.topnote,.badge{font-size:10px;border-radius:20px;padding:5px 9px;background:#eaf1eb;color:var(--g);font-weight:bold}.badge.no{background:#fbe9e6;color:#a33b32}.badge.pending{background:#fff3d9;color:#8b6117}.badge.neutral{background:#edf1ed;color:#68766d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:23px;color:var(--g);margin:4px 0}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--m)}.small{font-size:11px}.tiny{font-size:9px}.card,.stat{background:white;border:1px solid var(--l);border-radius:10px;padding:13px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.stat strong{display:block;font-size:21px;color:var(--g);margin:5px 0}.btn{border:1px solid var(--l);border-radius:7px;background:white;color:var(--t);padding:7px 10px;font-size:11px;font-weight:bold;cursor:pointer}.primary{background:var(--g);color:white;border-color:var(--g)}.secondary{background:#eaf1eb;color:var(--g)}.success{background:#eff8f0;color:#21633d;border-color:#c2ddc7}.danger{background:#fff5f3;color:#a53d34;border-color:#e7c9c5}.btn:disabled{opacity:.4;cursor:not-allowed}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--l);margin:15px 0;flex-wrap:wrap}.tab{border:0;background:transparent;padding:9px 12px;color:var(--m);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--g);border-color:var(--g);font-weight:bold}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:8px;background:white}table{border-collapse:collapse;width:100%;min-width:700px;font-size:10px}th{background:var(--p);color:var(--m);padding:9px;text-align:left;white-space:nowrap}td{padding:8px;border-top:1px solid #e7ece7;vertical-align:middle}.input{padding:7px;border:1px solid var(--l);border-radius:6px;width:100%;min-width:65px;font-size:11px}.vendorgrid,.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.vendor{border:1px solid var(--l);border-radius:8px;padding:10px;background:white}.notice{background:#f0f6f1;border:1px solid #d7e3d9;border-radius:8px;padding:10px;font-size:11px;margin:10px 0}.warning{background:#fff9ed;border:1px solid #e8d9b7;color:#76551c;border-radius:8px;padding:10px;font-size:11px;margin:10px 0}.progress{height:7px;background:#e8eee8;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#39845b}.step{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #e8ece8;align-items:flex-start}.dot{width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:grid;place-items:center;background:var(--p);font-size:9px}.dot.done{background:#e3f1e6;color:#21633d}.filebox{border:1px dashed #9aafa0;border-radius:8px;padding:10px;background:#f7faf7}.modalbg{position:fixed;inset:0;background:#12251d88;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:white;border-radius:12px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto}.footer{font-size:9px;color:var(--m);padding:12px 2px}#toast{display:none;position:fixed;bottom:18px;right:18px;background:#173c31;color:white;padding:10px 14px;border-radius:8px;z-index:20}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto}.label{display:none}.nav{white-space:nowrap;width:auto}main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.vendorgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid2{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><b>E-PROCUREMENT</b> <small>/ INTERACTIVE PROTOTYPE</small><div class="tiny" style="margin-top:4px;color:#c8ddd3">Sourcing · TBE · CBE · Negotiation · Award</div></div><span class="topnote">DEMO DATA · SESSION SIMULATION</span></header>
<div class="layout"><aside><div><div class="label">WORKSPACE</div><button class="nav active" data-page="dashboard">▦ PR Dashboard</button><button class="nav" data-page="workspace">▤ PR Workspace</button><div class="label">WORKFLOW</div><button class="nav" data-tab="tbe">01 TBE Evaluation</button><button class="nav" data-tab="cbe">02 CBE & Quotations</button><button class="nav" data-tab="negotiation">03 Negotiation</button><button class="nav" data-tab="award">04 Award</button></div></aside><main id="app"></main></div><div id="modal"></div><div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'IDR '+new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Number(n)||0);
const seeds=[
{no:'45001231',plant:'1001 · Balikpapan',desc:'Hydraulic Hose Assemblies',requester:'SCM Inventory',usd:68000,items:[['Hydraulic Hose Assembly',12,'EA',4200000],['Hose Fitting',30,'EA',2100000],['Adapter',12,'EA',1600000],['Coupling',18,'EA',1800000],['Seal Kit',20,'SET',950000],['Connector',15,'EA',1300000],['Clamp',25,'EA',750000]]},
{no:'45001245',plant:'1001 · Balikpapan',desc:'Bearings and Seals',requester:'Maintenance',usd:32000,items:[['Deep Groove Bearing',24,'EA',1500000],['Tapered Roller Bearing',16,'EA',2200000],['Oil Seal',40,'EA',300000],['Shaft Sleeve',10,'EA',1100000],['Retaining Ring',60,'EA',150000]]},
{no:'45001302',plant:'2001 · Jakarta',desc:'Electrical PPE and Safety Equipment',requester:'HSE Department',usd:14500,items:[['Safety Helmet',50,'EA',250000],['Safety Shoes',30,'PR',800000],['Protective Gloves',100,'PR',125000],['Safety Glasses',40,'EA',150000]]}];
const vs=[{id:'V1',name:'PT Prima Teknik',code:'VEN-001',factor:1,discount:3},{id:'V2',name:'PT Global Industri',code:'VEN-014',factor:.91,discount:0},{id:'V3',name:'PT Mitra Engineering',code:'VEN-026',factor:1.08,discount:5},{id:'V4',name:'PT Sumber Teknik',code:'VEN-031',factor:.96,discount:2}];
const prs=seeds.map(p=>{let items=p.items.map((x,i)=>({id:i+1,desc:x[0],qty:x[1],uom:x[2],budget:x[3],required:true}));let vendors=vs.map(v=>({...v,prices:items.map((it,i)=>Math.round(it.budget*v.factor*(1+((i%3)-1)*.018))),tbe:items.map(()=>({status:'Pending',files:[]})),quote:'',version:1,history:[],revision:false,revisionStatus:'No revision'}));return {...p,items,vendors,locked:false,approval:'Not submitted',sap:false,selected:'',email:false,po:'',events:[]};});
let pr=prs[0],page='dashboard',tab='overview',modal=null,negId='V1',draft=null,timer;
const app=$('#app');
function log(t,d){pr.events.unshift({t,d,at:new Date().toLocaleTimeString()})}
function badge(s){let c=s==='Comply'||s==='Complete'||s==='Approved'?'':s==='Not Comply'?'no':s==='Pending'||s==='Not submitted'?'pending':'neutral';return `<span class="badge ${c}">${esc(s)}</span>`}
function overall(v){let a=pr.items.map((it,i)=>it.required?v.tbe[i].status:null).filter(Boolean);if(!a.length)return'Not Required';if(a.includes('Not Comply'))return'Not Comply';if(a.includes('Pending'))return'Pending';return'Comply'}
function eligible(v){return ['Comply','Not Required'].includes(overall(v))}
function calc(v){let sub=pr.items.reduce((s,it,i)=>s+it.qty*(+v.prices[i]||0),0),disc=sub*(+v.discount||0)/100,after=sub-disc,vat=after*.11;return{sub,disc,after,vat,total:after+vat}}
function rank(){return pr.vendors.filter(eligible).map(v=>({v,...calc(v)})).sort((a,b)=>a.after-b.after)}
function prog(){let n=0,d=0;pr.items.forEach((it,i)=>{if(it.required)pr.vendors.forEach(v=>{n++;if(v.tbe[i].status!=='Pending')d++})});return{n,d,p:n?Math.round(d/n*100):100}}
function toast(s){let x=$('#toast');x.textContent=s;x.style.display='block';clearTimeout(timer);timer=setTimeout(()=>x.style.display='none',2200)}
function openPR(no){pr=prs.find(x=>x.no===no);page='workspace';tab='overview';modal=null;render()}
function setTab(t){page='workspace';tab=t;modal=null;render()}
function dashboard(){let pending=prs.reduce((a,p)=>a+p.vendors.reduce((b,v)=>b+v.tbe.filter((x,i)=>p.items[i].required&&x.status==='Pending').length,0),0);return `<div class="toolbar"><div><div class="small muted">PROCUREMENT / SOURCING</div><h1>PR Dashboard</h1><div class="small muted">Centralized PR, vendor participation, TBE, CBE and award workspace.</div></div><button class="btn primary" data-a="open" data-pr="${prs[0].no}">Open active PR →</button></div><div class="stats"><div class="stat"><span class="small muted">Active PRs</span><strong>${prs.length}</strong></div><div class="stat"><span class="small muted">Vendor participants</span><strong>${prs.length*4}</strong></div><div class="stat"><span class="small muted">TBE pending</span><strong>${pending}</strong></div><div class="stat"><span class="small muted">Approval threshold</span><strong>USD 50K</strong></div></div><div class="card"><h2>Purchase Requisitions</h2><div class="tablewrap"><table><thead><tr><th>PR Number</th><th>Plant</th><th>PR Description</th><th>Requester</th><th>Items</th><th>Vendors</th><th>Transaction Value</th><th>Stage</th><th></th></tr></thead><tbody>${prs.map(p=>`<tr><td><b>${p.no}</b></td><td>${esc(p.plant)}</td><td>${esc(p.desc)}</td><td>${esc(p.requester)}</td><td>${p.items.length}</td><td>${p.vendors.length}</td><td>USD ${p.usd.toLocaleString()}</td><td>${badge('TBE Evaluation')}</td><td><button class="btn secondary" data-a="open" data-pr="${p.no}">Open PR →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function workspace(){let p=prog();return `<div class="toolbar"><div><button class="btn" data-a="dashboard">← Dashboard</button><div class="small muted" style="margin-top:8px">PURCHASE REQUISITION / ${pr.no}</div><h1>${esc(pr.desc)}</h1><div class="small muted">${esc(pr.plant)} · ${esc(pr.requester)} · USD ${pr.usd.toLocaleString()}</div></div>${badge(pr.locked?'Submission Closed':'Submission Open')}</div><div class="stats"><div class="stat"><span class="small muted">PR Line Items</span><strong>${pr.items.length}</strong></div><div class="stat"><span class="small muted">Vendors</span><strong>${pr.vendors.length}</strong></div><div class="stat"><span class="small muted">TBE Evaluated</span><strong>${p.d}/${p.n}</strong></div><div class="stat"><span class="small muted">CBE Eligible</span><strong>${rank().length}</strong></div></div><div class="tabs">${[['overview','Overview'],['tbe','TBE Evaluation'],['cbe','CBE & Quotations'],['negotiation','Negotiation'],['award','Award']].map(([id,l])=>`<button class="tab ${tab===id?'active':''}" data-a="tab" data-tab="${id}">${l}</button>`).join('')}</div>${tab==='overview'?overview():tab==='tbe'?tbe():tab==='cbe'?cbe():tab==='negotiation'?negotiation():award()}<div class="footer">Demo only. No SAP, email, vendor account, or document repository connection. Session changes are not shared or permanently stored.</div>`}
function overview(){let p=prog();return `<div class="grid2"><div class="card"><h2>TBE Progress</h2><b style="font-size:22px">${p.d}/${p.n}</b><div class="progress"><span style="width:${p.p}%"></span></div><p class="small muted">One evaluation for each Vendor × TBE-required Line Item.</p></div><div class="card"><h2>CBE Status</h2><b style="font-size:22px">${rank().length} eligible vendors</b><p class="small muted">Vendors with any Not Comply or Pending TBE record are excluded from ranking.</p></div></div><div class="card"><h2>Vendor TBE Summary</h2><div class="vendorgrid">${pr.vendors.map(v=>`<div class="vendor"><b>${esc(v.name)}</b><div class="tiny muted">${v.code}</div><div style="margin:7px 0">${badge(overall(v))}</div><span class="tiny muted">${v.tbe.filter((x,i)=>pr.items[i].required&&x.status==='Comply').length} Comply · ${v.tbe.filter((x,i)=>pr.items[i].required&&x.status==='Not Comply').length} Not Comply · ${v.tbe.filter((x,i)=>pr.items[i].required&&x.status==='Pending').length} Pending</span></div>`).join('')}</div></div><div class="card"><h2>Recent Activity</h2>${pr.events.slice(0,6).map(e=>`<div class="step"><span>✓</span><div><b>${esc(e.t)}</b><div class="small muted">${esc(e.d)} ${e.at||''}</div></div></div>`).join('')||'<span class="small muted">No activity yet.</span>'}</div>`}
function tbe(){let p=prog();return `<div class="notice"><b>TBE logic:</b> one record per <b>Vendor × PR Line Item</b>. Upload evidence for that specific pair, then select Comply or Not Comply. Vendor overall TBE is calculated from all required line items.</div><div class="toolbar"><div><h2>Technical Bid Evaluation Matrix</h2><div class="small muted">${pr.items.length} items × ${pr.vendors.length} vendors = ${p.n} separate TBE records</div></div><b>${p.d}/${p.n} evaluated · ${p.p}%</b></div><div class="progress"><span style="width:${p.p}%"></span></div><div class="tablewrap" style="margin-top:12px"><table style="min-width:900px"><thead><tr><th>PR Line Item</th><th>Qty / UOM</th><th>TBE Required?</th>${pr.vendors.map(v=>`<th>${esc(v.name)}<div class="tiny">${v.code}</div></th>`).join('')}</tr></thead><tbody>${pr.items.map((it,i)=>`<tr><td><b>${i+1}. ${esc(it.desc)}</b></td><td>${it.qty} ${it.uom}</td><td><button class="btn ${it.required?'success':'warning'}" data-a="required" data-i="${i}" ${pr.locked?'disabled':''}>${it.required?'✓ Required':'Not Required'}</button></td>${pr.vendors.map(v=>`<td>${it.required?badge(v.tbe[i].status):badge('Not Required')}<div class="tiny muted" style="margin:5px 0">${v.tbe[i].files.length} evidence file(s)</div><button class="btn secondary" data-a="manage" data-v="${v.id}" data-i="${i}" ${!it.required||pr.locked?'disabled':''}>Manage TBE</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">Not Required line items are excluded from overall TBE status.</p>`}
function cbe(){let r=rank();return `<div class="notice"><b>Live CBE:</b> prices are entered per line item. Subtotal, discount, VAT and ranking recalculate when price/discount changes. Final evaluation is locked after submission closes.</div><div class="toolbar"><div><h2>Commercial Bid Evaluation</h2><div class="small muted">Currency IDR · Demo VAT 11% · Ranking basis: after discount, excluding VAT</div></div><button class="btn secondary" data-a="csv">↓ Download CBE CSV</button></div><div class="tablewrap" style="margin-top:10px"><table style="min-width:900px"><thead><tr><th>Description</th><th>Qty</th><th>UOM</th><th>Budget / Unit</th>${pr.vendors.map(v=>`<th>${esc(v.name)}<div class="tiny">${badge(overall(v))}</div></th>`).join('')}</tr></thead><tbody>${pr.items.map((it,i)=>`<tr><td>${esc(it.desc)}</td><td>${it.qty}</td><td>${it.uom}</td><td>${money(it.budget)}</td>${pr.vendors.map(v=>`<td><input class="input" type="number" data-price="${v.id}" data-i="${i}" value="${v.prices[i]}" ${pr.locked?'disabled':''}></td>`).join('')}</tr>`).join('')}<tr><td colspan="4"><b>Discount (%)</b></td>${pr.vendors.map(v=>`<td><input class="input" type="number" data-discount="${v.id}" value="${v.discount}" ${pr.locked?'disabled':''}></td>`).join('')}</tr>${[['Subtotal','sub'],['Discount Amount','disc'],['After Discount Excl VAT','after'],['VAT 11%','vat'],['Total Incl VAT','total']].map(([l,k])=>`<tr><td colspan="4"><b>${l}</b></td>${pr.vendors.map(v=>`<td>${money(calc(v)[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="vendorgrid" style="margin-top:12px">${pr.vendors.map(v=>`<div class="vendor"><b>${esc(v.name)}</b><div style="margin:5px 0">${badge(overall(v))}</div><div class="small muted">${esc(v.quote||'No quotation attached')}</div><label class="btn" style="display:inline-block;margin-top:7px">Attach quotation<input type="file" class="hidden" data-quote="${v.id}" ${pr.locked?'disabled':''}></label><div class="tiny muted">V${v.version}</div></div>`).join('')}</div><div class="card"><h2>Eligible Vendor Ranking</h2>${r.length?r.map((x,i)=>`<div class="step"><b>${i+1}</b><div style="flex:1">${esc(x.v.name)} <span class="tiny muted">· ${overall(x.v)}</span></div><b>${money(x.after)}</b></div>`).join(''):'<div class="warning">No eligible vendor yet. Complete TBE first.</div>'}</div>`}
function negotiation(){let v=pr.vendors.find(x=>x.id===negId)||pr.vendors[0];return `<div class="notice">Buyer requests a price revision. Vendor updates authorized prices and attaches a revised quotation in the portal. Each revision creates a new version and recalculates CBE.</div><div class="card"><div class="toolbar"><h2>Negotiation Management</h2>${badge(v.revisionStatus)}</div><div class="row" style="margin:10px 0"><label class="small muted">Vendor</label><select id="neg-vendor" class="input" style="max-width:280px">${pr.vendors.map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${!v.revision?`<div class="toolbar"><div><b>${esc(v.name)}</b><div class="small muted">Current quotation V${v.version}</div></div><button class="btn primary" data-a="request" data-v="${v.id}" ${pr.locked?'disabled':''}>Request Price Revision</button></div>`:`<div class="warning">Revision requested. Vendor can update prices and attach revised quotation.</div><div class="tablewrap"><table><thead><tr><th>Line Item</th><th>Current Price</th><th>Revised Price</th></tr></thead><tbody>${pr.items.map((it,i)=>`<tr><td>${esc(it.desc)}</td><td>${money(v.prices[i])}</td><td><input class="input" type="number" data-reprice="${i}" value="${draft?.prices[i]??v.prices[i]}"></td></tr>`).join('')}<tr><td colspan="2">Discount (%)</td><td><input class="input" id="redisc" type="number" value="${draft?.discount??v.discount}"></td></tr></tbody></table></div><div class="filebox"><input id="revfile" type="file"><div class="tiny muted">${esc(draft?.file||'No revised quote selected')}</div></div><div class="row" style="margin-top:8px"><button class="btn primary" data-a="submit-revision" data-v="${v.id}">Submit Revised Quotation</button><button class="btn" data-a="cancel-revision" data-v="${v.id}">Cancel</button></div>`}</div><div class="card"><h2>Quotation Version History</h2><div class="step">V${v.version} · Current · ${esc(v.quote||'Quotation not attached')}</div>${v.history.map(h=>`<div class="step">V${h.version} · ${esc(h.file)}</div>`).join('')||'<span class="small muted">No previous revisions.</span>'}</div>`}
function award(){let p=prog(),r=rank(),route=pr.usd>50000?'Commercial Committee Meeting':'PAL approval via email',sel=pr.vendors.find(v=>v.id===pr.selected);return `<div class="notice"><b>Award sequence:</b> Close submission / lock final CBE → CMM or PAL approval → final CBE approval in SAP → confirm selected vendor → award email → PO.</div><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat">TBE completion<strong>${p.d}/${p.n}</strong></div><div class="stat">Approval route<strong style="font-size:13px">${route}</strong></div><div class="stat">Current stage<strong style="font-size:13px">${pr.po?'PO Issued':pr.email?'Award Email Sent':pr.selected?'Award Confirmed':pr.sap?'SAP Approved':pr.approval}</strong></div></div><div class="card"><h2>Final CBE & TBE Readiness</h2><div class="progress"><span style="width:${p.p}%"></span></div><div class="small muted" style="margin:6px 0">${p.d}/${p.n} TBE records evaluated</div>${pr.locked?badge('Final CBE Locked'):`<button class="btn primary" data-a="close" ${p.d===p.n?'':'disabled'}>Close Submission & Lock Final CBE</button>`}</div><div class="card"><h2>Approval & Award Workflow</h2>${step(1,'Close submission / lock final CBE','Final TBE and CBE snapshot.',pr.locked)}${step(2,'Submit for approval',route,pr.approval!=='Not submitted',pr.locked&&pr.approval==='Not submitted'?'<button class="btn primary" data-a="submit">Submit</button>':'')}${step(3,'Record CMM / PAL approval','Approval decision recorded.',pr.approval==='Approved',pr.approval==='Submitted'?'<button class="btn success" data-a="approve">Record Approved</button>':'')}${step(4,'Final CBE approval in SAP','PAL approver records final approval in SAP.',pr.sap,pr.approval==='Approved'&&!pr.sap?'<button class="btn primary" data-a="sap">Approve in SAP</button>':'')}<div class="step"><b>5</b><div style="flex:1"><b>Confirm selected vendor</b><div class="small muted">Select a TBE-eligible vendor after approval.</div>${pr.sap&&!pr.selected?`<div class="row"><select id="award-vendor" class="input" style="max-width:260px">${r.map(x=>`<option value="${x.v.id}">${esc(x.v.name)} · ${money(x.after)}</option>`).join('')}</select><button class="btn primary" data-a="confirm">Confirm Award</button></div>`:''}${sel?'<div class="small">'+esc(sel.name)+'</div>':''}</div>${badge(pr.selected?'Complete':'Pending')}</div>${step(6,'Send award notification email','To selected vendor; CC Buyer / requester / stakeholders.',pr.email,pr.selected&&!pr.email?'<button class="btn primary" data-a="email">Send Email</button>':'')}<div class="step"><b>7</b><div style="flex:1"><b>Issue PO to selected vendor</b><div class="small muted">PO remains a separate SAP document.</div>${pr.po?esc(pr.po):''}</div>${pr.email&&!pr.po?'<button class="btn primary" data-a="po">Issue PO</button>':badge(pr.po?'Issued':'Pending')}</div>${pr.approval==='Submitted'?'<button class="btn danger" data-a="return">Return for revision / renegotiation</button>':''}</div><div class="card"><h2>Eligible Vendor Comparison</h2>${r.map((x,i)=>`<div class="step"><b>${i+1}</b><div style="flex:1">${esc(x.v.name)} · ${badge(overall(x.v))}</div><b>${money(x.after)}</b></div>`).join('')||'<div class="warning">No eligible vendors yet.</div>'}</div>`}
function step(n,t,d,done,action=''){return `<div class="step"><span class="dot ${done?'done':''}">${n}</span><div style="flex:1"><b>${t}</b><div class="small muted">${d}</div></div>${action||badge(done?'Complete':'Pending')}</div>`}
function render(){app.innerHTML=page==='dashboard'?dashboard():workspace();$('#modal').innerHTML=renderModal();$$('.nav').forEach(x=>x.classList.toggle('active',page==='dashboard'?x.dataset.page==='dashboard':x.dataset.page==='workspace'))}
function renderModal(){if(!modal)return'';let v=pr.vendors.find(x=>x.id===modal.v),i=modal.i,c=v.tbe[i];return `<div class="modalbg" data-a="backdrop"><div class="modal"><div class="toolbar"><div><div class="tiny muted">TBE / LINE ITEM ${i+1}</div><h2>${esc(pr.items[i].desc)}</h2></div><button class="btn" data-a="close">✕</button></div><div class="small muted">Vendor</div><b>${esc(v.name)} · ${v.code}</b><div style="margin:10px 0">${badge(c.status)}</div><div class="filebox"><b class="small">Upload TBE evidence</b><p class="small muted">Evidence is attached to this vendor and line item only.</p><input id="evidence" type="file" multiple><button class="btn secondary" style="margin-top:7px" data-a="save-evidence" data-v="${v.id}" data-i="${i}">Save selected evidence</button><div style="margin-top:8px">${c.files.map(f=>`<div class="small">📎 ${esc(f)}</div>`).join('')||'<span class="small muted">No evidence attached.</span>'}</div></div><p class="small muted">Engineer / User evaluation</p><div class="row"><button class="btn success" data-a="set-tbe" data-status="Comply" data-v="${v.id}" data-i="${i}" ${c.files.length?'':'disabled'}>✓ Comply</button><button class="btn danger" data-a="set-tbe" data-status="Not Comply" data-v="${v.id}" data-i="${i}" ${c.files.length?'':'disabled'}>✕ Not Comply</button><button class="btn" data-a="reset" data-v="${v.id}" data-i="${i}">Reset</button></div><div class="divider"></div><div class="small">Vendor overall TBE: ${badge(overall(v))}</div></div></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a],[data-page],[data-tab]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.tab){setTab(b.dataset.tab);return}let a=b.dataset.a,v=pr.vendors.find(x=>x.id===b.dataset.v),i=+b.dataset.i;
if(a==='dashboard'){page='dashboard';render()}else if(a==='open'){openPR(b.dataset.pr)}else if(a==='tab'){setTab(b.dataset.tab)}else if(a==='manage'){modal={v:b.dataset.v,i};render()}else if(a==='close'){modal=null;render()}else if(a==='backdrop'&&e.target===b){modal=null;render()}
else if(a==='required'){pr.items[i].required=!pr.items[i].required;pr.vendors.forEach(x=>x.tbe[i].status=pr.items[i].required?'Pending':'Not Required');render()}
else if(a==='save-evidence'){let f=[...($('#evidence').files||[])].map(x=>x.name);if(!f.length){toast('Choose file(s) first');return}v.tbe[i].files=[...new Set([...v.tbe[i].files,...f])];log('TBE evidence uploaded',`${v.name} · ${pr.items[i].desc}: ${f.join(', ')}`);render();toast('Evidence attached')}
else if(a==='set-tbe'){if(!v.tbe[i].files.length)return;v.tbe[i].status=b.dataset.status;log('TBE evaluated',`${v.name} · ${pr.items[i].desc}: ${v.tbe[i].status}`);modal=null;render()}
else if(a==='reset'){v.tbe[i].status='Pending';render()}
else if(a==='request'){negId=v.id;v.revision=true;v.revisionStatus='Revision Requested';draft={prices:[...v.prices],discount:v.discount,file:''};log('Price revision requested',v.name);render()}
else if(a==='cancel-revision'){v.revision=false;draft=null;render()}
else if(a==='submit-revision'){v.history.unshift({version:v.version,file:v.quote||'No file'});v.prices=[...draft.prices];v.discount=+draft.discount||0;v.version++;v.quote=draft.file||`Revised quotation V${v.version}`;v.revision=false;v.revisionStatus='Revised Quote Received';draft=null;log('Revised quotation received',`${v.name} · V${v.version}; CBE recalculated`);render();toast('Revision submitted; CBE recalculated')}
else if(a==='close'){if(prog().d!==prog().n)return;pr.locked=true;log('Submission closed','Final CBE locked');render()}
else if(a==='submit'){pr.approval='Submitted';log('Approval submitted',pr.usd>50000?'Commercial Committee Meeting':'PAL email');render()}
else if(a==='approve'){pr.approval='Approved';log('Approval recorded','CMM / PAL approval recorded');render()}
else if(a==='sap'){pr.sap=true;log('Final CBE approved in SAP','Simulated SAP approval');render()}
else if(a==='confirm'){pr.selected=$('#award-vendor').value;log('Award confirmed',pr.vendors.find(x=>x.id===pr.selected).name);render()}
else if(a==='email'){pr.email=true;log('Award notification email sent','Vendor notified; Buyer / requester / stakeholders copied');render();toast('Email simulated as sent')}
else if(a==='po'){pr.po='PO-DEMO-'+pr.no.slice(-5);log('PO issued',pr.po);render()}
else if(a==='return'){pr.locked=false;pr.approval='Returned for revision';pr.sap=false;pr.selected='';pr.email=false;pr.po='';setTab('negotiation')}
else if(a==='csv'){let rows=[['PR',pr.no],['Plant',pr.plant],['Description',pr.desc],[],['Line Item','Description','Qty','UOM','Budget',...pr.vendors.map(v=>v.name)],...pr.items.map((it,i)=>[i+1,it.desc,it.qty,it.uom,it.budget,...pr.vendors.map(v=>v.prices[i])]),[],['Discount %','','','','',...pr.vendors.map(v=>v.discount)],['After Discount Excl VAT','','','','',...pr.vendors.map(v=>calc(v).after)]];let blob=new Blob([rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CBE_${pr.no}.csv`;a.click();URL.revokeObjectURL(url)}
});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-price]')){let v=pr.vendors.find(x=>x.id===t.dataset.price);v.prices[+t.dataset.i]=+t.value||0;render();toast('CBE recalculated')}else if(t.matches('[data-discount]')){pr.vendors.find(x=>x.id===t.dataset.discount).discount=+t.value||0;render();toast('CBE recalculated')}else if(t.matches('[data-quote]')){let v=pr.vendors.find(x=>x.id===t.dataset.quote);if(t.files[0]){v.quote=t.files[0].name;render()}}else if(t.id==='neg-vendor'){negId=t.value;draft=null;render()}else if(t.matches('[data-reprice]')&&draft){draft.prices[+t.dataset.reprice]=+t.value||0}else if(t.id==='redisc'&&draft){draft.discount=+t.value||0}else if(t.id==='revfile'&&draft&&t.files[0]){draft.file=t.files[0].name}});
render();
})();
</script></body></html>
